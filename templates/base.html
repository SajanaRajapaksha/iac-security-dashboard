<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IaC Security Framework Dashboard — Security scan visualization and evidence viewer">
    <title>{% block title %}IaC Security Framework{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Dashboard CSS -->
    <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">

    {% block head %}{% endblock %}
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-shield-lock-fill"></i>
            <span>IaC Security<br><small>Framework</small></span>
        </div>

        <ul class="sidebar-nav">
            <li class="sidebar-nav-item">
                <a href="{{ url_for('dashboard.index') }}" class="sidebar-nav-link active">
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span>Dashboard</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="sidebar-footer-badge">
                <i class="bi bi-lock-fill"></i> Read-Only
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main id="main-content" class="main-content">
        <!-- Top Header -->
        <header class="content-header">
            <div class="content-header-left">
                <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                {% block page_subtitle %}{% endblock %}
            </div>
            <div class="content-header-right">
                {% block header_actions %}{% endblock %}
            </div>
        </header>

        <!-- Page Content -->
        <div class="content-body">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
